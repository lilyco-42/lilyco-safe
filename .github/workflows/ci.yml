name: CI & Cross-Platform Build (lyco_dev)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting & clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run full workspace unit & E2E tests
        run: cargo test --workspace

  cross-platform-zigbuild:
    needs: test-and-lint
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y cargo-zigbuild
      - name: Build ${{ matrix.target }}
        run: cargo zigbuild --release --target ${{ matrix.target }} -p relay-server

  wasm-core-check:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify relay-core compiles to WASM
        run: cargo check -p relay-core --target wasm32-unknown-unknown
